<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance - Select Coin</title>
    <!-- Google Fonts: Inter with premium weights -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=ui-upgrade-v1">
    <style>
        .asset-logo-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: contain;
        }

        .coin-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .coin-item-row:hover {
            background-color: var(--bg-color-badge);
        }

        .asset-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .asset-names {
            display: flex;
            flex-direction: column;
        }

        .asset-name-symbol {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-white);
            line-height: 1.2;
        }

        .asset-name-full {
            font-size: 13px;
            font-weight: 400;
            color: var(--color-text-gray);
            margin-top: 2px;
        }

        .asset-item-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .asset-bal-crypto {
            font-size: 15px;
            font-weight: 600;
            color: var(--color-text-white);
            line-height: 1.2;
        }

        .asset-bal-fiat {
            font-size: 12px;
            font-weight: 400;
            color: var(--color-text-gray);
            margin-top: 2px;
        }
    </style>
</head>

<body>
    <!-- Premium Viewport Container centered on desktop, full-screen on mobile -->
    <div class="phone-viewport">

        <!-- Sticky Select Coin Header -->
        <header class="coin-select-header"
            style="justify-content: space-between; padding: 0 16px; height: 56px; display: flex; align-items: center;">
            <a href="assets.html" class="coin-header-back-btn"
                style="flex: 1; display: flex; color: var(--color-text-gray);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <span class="coin-header-title"
                style="flex: 2; text-align: center; font-size: 18px; font-weight: 600; color: var(--color-text-white);">Select
                Coin</span>
            <div style="flex: 1; display: flex; justify-content: flex-end;">
                <svg class="coin-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="color: var(--color-text-gray);">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
        </header>

        <!-- Main Scrollable Content -->
        <main class="scroll-content">

            <!-- Wallet Scope Selector -->
            <section style="padding: 16px; display: flex; align-items: center; gap: 8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-text-white);">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span style="font-size: 15px; font-weight: 500; color: var(--color-text-white);">Spot + Funding + Earn
                    Flexible</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-text-white);">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </section>

            <!-- Coins Rows List Container -->
            <section class="coin-list-container" style="padding-top: 0;">

                <!-- ETH Row Item -->
                <div class="coin-item-row" onclick="window.location.href='send-usdt.html'">
                    <div class="asset-item-left">
                        <img src="https://cryptologos.cc/logos/ethereum-eth-logo.svg" class="asset-logo-img" alt="ETH">
                        <div class="asset-names">
                            <span class="asset-name-symbol">ETH</span>
                            <span class="asset-name-full">Ethereum</span>
                        </div>
                    </div>
                    <div class="asset-item-right">
                        <span class="asset-bal-crypto">0.41394871</span>
                        <span class="asset-bal-fiat">≈ $792.7</span>
                    </div>
                </div>

                <!-- USDT Row Item -->
                <div class="coin-item-row" id="coinItemUSDT" onclick="window.location.href='send-usdt.html'">
                    <div class="asset-item-left">
                        <img src="assets/usdt.svg" class="asset-logo-img" alt="USDT">
                        <div class="asset-names">
                            <span class="asset-name-symbol">USDT</span>
                            <span class="asset-name-full">TetherUS</span>
                        </div>
                    </div>
                    <div class="asset-item-right">
                        <span class="asset-bal-crypto" id="coinCryptoBal">31.27236689</span>
                        <span class="asset-bal-fiat" id="coinFiatBal">≈ $31.27</span>
                    </div>
                </div>

                <!-- BTC Row Item -->
                <div class="coin-item-row" onclick="window.location.href='send-usdt.html'">
                    <div class="asset-item-left">
                        <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.svg" class="asset-logo-img" alt="BTC">
                        <div class="asset-names">
                            <span class="asset-name-symbol">BTC</span>
                            <span class="asset-name-full">Bitcoin</span>
                        </div>
                    </div>
                    <div class="asset-item-right">
                        <span class="asset-bal-crypto">0.0000113</span>
                        <span class="asset-bal-fiat">≈ $0.76059622</span>
                    </div>
                </div>

                <!-- LTC Row Item -->
                <div class="coin-item-row" onclick="window.location.href='send-usdt.html'">
                    <div class="asset-item-left">
                        <img src="https://cryptologos.cc/logos/litecoin-ltc-logo.svg" class="asset-logo-img" alt="LTC">
                        <div class="asset-names">
                            <span class="asset-name-symbol">LTC</span>
                            <span class="asset-name-full">Litecoin</span>
                        </div>
                    </div>
                    <div class="asset-item-right">
                        <span class="asset-bal-crypto">0.01044587</span>
                        <span class="asset-bal-fiat">≈ $0.49941704</span>
                    </div>
                </div>

                <!-- BONK Row Item -->
                <div class="coin-item-row" onclick="window.location.href='send-usdt.html'">
                    <div class="asset-item-left">
                        <div class="asset-logo-img"
                            style="background-color: #F8981D; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                            <img src="https://cryptologos.cc/logos/bonk1-bonk-logo.svg"
                                style="width: 24px; height: 24px;" alt="BONK"
                                onerror="this.style.display='none'; this.parentElement.innerText='B';">
                        </div>
                        <div class="asset-names">
                            <span class="asset-name-symbol">BONK</span>
                            <span class="asset-name-full">Bonk</span>
                        </div>
                    </div>
                    <div class="asset-item-right">
                        <span class="asset-bal-crypto">468</span>
                        <span class="asset-bal-fiat">≈ $0.00239148</span>
                    </div>
                </div>

                <!-- MBOX Row Item -->
                <div class="coin-item-row" onclick="window.location.href='send-usdt.html'">
                    <div class="asset-item-left">
                        <div class="asset-logo-img"
                            style="background-color: #004B8F; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;">
                            <img src="https://cryptologos.cc/logos/mobox-mbox-logo.svg"
                                style="width: 24px; height: 24px;" alt="MBOX"
                                onerror="this.style.display='none'; this.parentElement.innerText='M';">
                        </div>
                        <div class="asset-names">
                            <span class="asset-name-symbol">MBOX</span>
                            <span class="asset-name-full">MOBOX</span>
                        </div>
                    </div>
                    <div class="asset-item-right">
                        <span class="asset-bal-crypto">0.00003023</span>
                        <span class="asset-bal-fiat">≈ $0.00000037</span>
                    </div>
                </div>

            </section>

        </main>

    </div>

    <!-- Script Import -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isMasked = localStorage.getItem('assets_isMasked') === 'true';

            function getLiveUSDT() {
                return typeof window.binanceBalance !== 'undefined' ? window.binanceBalance : parseFloat(localStorage.getItem('wallet_usdt_balance') || '31.27236689');
            }

            const cryptoBalEl = document.getElementById('coinCryptoBal');
            const fiatBalEl = document.getElementById('coinFiatBal');

            function updateUI() {
                const liveUSDT = getLiveUSDT();

                if (isMasked) {
                    if (cryptoBalEl) cryptoBalEl.textContent = '********';
                    if (fiatBalEl) fiatBalEl.textContent = '≈ ****';

                    // Mask other coins too
                    document.querySelectorAll('.asset-bal-crypto:not(#coinCryptoBal)').forEach(el => el.textContent = '********');
                    document.querySelectorAll('.asset-bal-fiat:not(#coinFiatBal)').forEach(el => el.textContent = '≈ ****');
                } else {
                    if (cryptoBalEl) cryptoBalEl.textContent = liveUSDT.toFixed(8);
                    if (fiatBalEl) fiatBalEl.textContent = '≈ $' + liveUSDT.toFixed(2);
                }
            }
            updateUI();
            window.addEventListener('binanceBalanceUpdated', updateUI);
        });
    </script>
    <script src="app.js?v=ui-upgrade-v1"></script>
    <script type="module" src="firebase-sync.js?v=23"></script>
</body>

</html>
