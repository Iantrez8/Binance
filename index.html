<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance - Exchange Home</title>
    <link rel="stylesheet" href="style.css?v=drawer-blend-v10">
</head>

<body>
    <div class="phone-viewport">

        <!-- Top Navbar -->
        <nav class="home-navbar">
            <div class="nav-left">
                <!-- Hamburger Menu -->
                <svg class="navbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <line x1="4" y1="7" x2="20" y2="7"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="17" x2="20" y2="17"></line>
                </svg>
                <!-- Binance BNB Logo -->
                <svg class="navbar-binance-logo" viewBox="0 0 126.61 126.61" fill="currentColor">
                    <polygon points="38.73,53.98 63.3,29.41 87.89,53.98 102.31,39.57 63.3,0.54 24.32,39.57" />
                    <polygon points="0.54,63.3 14.96,48.89 29.37,63.3 14.96,77.72" />
                    <polygon points="38.73,72.63 63.3,97.2 87.89,72.63 102.31,87.04 63.3,126.07 24.32,87.06" />
                    <polygon points="97.24,63.31 111.66,48.9 126.07,63.31 111.66,77.73" />
                    <polygon points="77.83,63.3 63.3,48.78 52.59,59.49 51.34,60.73 48.78,63.3 63.3,77.83 77.83,63.31" />
                </svg>
            </div>

            <!-- Segmented Control -->
            <div class="segmented-control">
                <button class="segment-btn active">Exchange</button>
                <button class="segment-btn">Wallet</button>
            </div>

            <div class="nav-right">
                <!-- QR Scanner Frame -->
                <svg class="navbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 3H5a2 2 0 00-2 2v2m0 10v2a2 2 0 002 2h2m10-18h2a2 2 0 012 2v2m0 10v2a2 2 0 01-2 2h-2" />
                </svg>
                <!-- Chat/Message Icon with badge -->
                <div class="navbar-icon-badge">
                    <svg class="navbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z">
                        </path>
                    </svg>
                    <span class="navbar-badge">99+</span>
                </div>
            </div>
        </nav>

        <!-- Scrollable Content -->
        <main class="scroll-content">

            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-bar">
                    <div class="search-left" style="width: 160px;">
                        <div class="search-ticker-container"
                            style="position: relative; height: 18px; overflow: hidden; width: 100%;">
                            <div class="ticker-item"
                                style="position: absolute; top: 0px; left: 0px; width: 100%; transition: top 0.4s ease-in-out; display: flex; align-items: center; gap: 6px;">
                                <span class="search-fire-emoji">🔥</span>
                                <span class="search-placeholder" style="white-space: nowrap;">PHB top gainer</span>
                            </div>
                        </div>
                    </div>
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
            </div>

            <!-- Balance -->
            <div class="home-balance-section">
                <div class="balance-lbl-row">
                    <span>Est. Total Value(USD)</span>
                    <svg class="lbl-caret-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="18 15 12 9 6 15"></polyline>
                    </svg>
                </div>
                <div class="home-balance-main-row">
                    <div class="home-balance-amount">$0.00</div>
                    <button class="btn-add-funds">Add Funds</button>
                </div>
                <div class="home-pnl-row">
                    <span>Today's PNL --</span>
                    <svg class="pnl-caret-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </div>

            <!-- Main Content Image Slice -->
            <img src="assets/homem.jpg" style="width: 100%; display: block; margin-top: 16px;" alt="Home Features">

        </main>

        <!-- Bottom Navigation -->
        <footer class="global-bottom-nav">
            <a href="index.html" class="nav-tab-link active">
                <!-- Binance BNB Diamond -->
                <svg class="nav-tab-icon" width="24" height="24" viewBox="0 0 126.61 126.61" fill="currentColor">
                    <polygon points="38.73,53.98 63.3,29.41 87.89,53.98 102.31,39.57 63.3,0.54 24.32,39.57" />
                    <polygon points="0.54,63.3 14.96,48.89 29.37,63.3 14.96,77.72" />
                    <polygon points="38.73,72.63 63.3,97.2 87.89,72.63 102.31,87.04 63.3,126.07 24.32,87.06" />
                    <polygon points="97.24,63.31 111.66,48.9 126.07,63.31 111.66,77.73" />
                    <polygon points="77.83,63.3 63.3,48.78 52.59,59.49 51.34,60.73 48.78,63.3 63.3,77.83 77.83,63.31" />
                </svg>
                <span class="nav-tab-label">Home</span>
            </a>
            <a href="javascript:void(0)" class="nav-tab-link">
                <!-- Markets Icon: Trendline with up arrow and underline bar -->
                <svg class="nav-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19h16" />
                    <path d="M6 14l4-5 4 3 5-6" />
                    <path d="M15 6h4v4" />
                </svg>
                <span class="nav-tab-label">Markets</span>
            </a>
            <a href="javascript:void(0)" class="nav-tab-link">
                <!-- Trade Icon: Double curved arrows circle with center diamond -->
                <svg class="nav-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12c0-4.4 3.6-8 8-8c2.4 0 4.6 1.1 6 2.8" />
                    <path d="M14 7h5V2" />
                    <path d="M20 12c0 4.4-3.6 8-8 8c-2.4 0-4.6-1.1-6-2.8" />
                    <path d="M10 17H5v5" />
                    <polygon points="12,8.5 15.5,12 12,15.5 8.5,12" fill="currentColor" stroke="none" />
                </svg>
                <span class="nav-tab-label">Trade</span>
            </a>
            <a href="javascript:void(0)" class="nav-tab-link">
                <!-- Futures Icon: Document outline with yellow/gold diamond bottom-right -->
                <svg class="nav-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="3" width="14" height="18" rx="2" />
                    <line x1="8" y1="8" x2="16" y2="8" />
                    <line x1="8" y1="12" x2="13" y2="12" />
                    <polygon points="18,14.5 21.5,18 18,21.5 14.5,18" fill="#F0B90B" stroke="none" />
                </svg>
                <span class="nav-tab-label">Futures</span>
            </a>
            <a href="assets.html" class="nav-tab-link">
                <!-- Assets Icon: Folder/Wallet slot with center-right diamond -->
                <svg class="nav-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 6h5l2 2h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" />
                    <polygon points="15,11 18,14 15,17 12,14" fill="#F0B90B" stroke="none" />
                </svg>
                <span class="nav-tab-label">Assets</span>
            </a>
        </footer>

    </div>
    <script src="app.js?v=drawer-blend-v12"></script>
    <script type="module" src="firebase-sync.js?v=23"></script>
</body>

</html>
